<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Real-time posts feed from JSONPlaceholder API">
    <title>Posts Dashboard</title>
    <style>
        :root {
            --color-bg: #f9fafb;
            --color-surface: #ffffff;
            --color-text: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --color-accent: #0ea5e9;
            --color-error: #dc2626;
            --radius: 8px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--color-bg);
            color: var(--color-text);
            line-height: 1.6;
            padding: 16px;
        }
        
        .container { max-width: 800px; margin: 0 auto; }
        
        header {
            background: var(--color-surface);
            padding: 24px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
        }
        
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 16px;
            font-size: 14px;
        }
        
        .stat-item {
            padding: 12px;
            background: var(--color-bg);
            border-radius: 6px;
            border-left: 3px solid var(--color-accent);
        }
        
        .stat-label { color: var(--color-text-secondary); font-weight: 500; }
        .stat-value {
            font-size: 20px;
            font-weight: 700;
            color: var(--color-accent);
            margin-top: 4px;
        }
        
        main { display: grid; gap: 12px; }
        
        .card {
            background: var(--color-surface);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border-left: 4px solid var(--color-accent);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }
        
        .card:hover, .card:focus-within {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        
        .card h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--color-text);
            line-height: 1.4;
        }
        
        .card p {
            font-size: 14px;
            color: var(--color-text-secondary);
            margin-bottom: 12px;
            line-height: 1.6;
        }
        
        .card-meta {
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .loading { text-align: center; padding: 40px 20px; color: var(--color-text-secondary); }
        
        .skeleton {
            background: linear-gradient(90deg, var(--color-border) 25%, #f3f4f6 50%, var(--color-border) 75%);
            background-size: 200% 100%;
            animation: pulse 1.5s ease-in-out infinite;
            border-radius: 6px;
            height: 100px;
            margin-bottom: 12px;
        }
        
        @keyframes pulse {
            0%, 100% { background-position: 200% 0; }
            50% { background-position: -200% 0; }
        }
        
        .error {
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: var(--radius);
            color: var(--color-error);
            padding: 16px;
            margin-bottom: 16px;
        }
        
        .error::before { content: "⚠ "; font-weight: 700; }
        
        @media (max-width: 640px) {
            body { padding: 12px; }
            header { padding: 16px; }
            h1 { font-size: 24px; }
            .card { padding: 16px; }
            .stats { grid-template-columns: 1fr; }
        }
        
        @media (prefers-contrast: more) {
            .card { border-left-width: 6px; }
            .stat-item { border-left-width: 4px; }
        }
        
        @media (prefers-reduced-motion: reduce) {
            * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Posts Dashboard</h1>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Records Loaded</div>
                    <div class="stat-value" id="count" aria-live="polite">—</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Fetch Time</div>
                    <div class="stat-value" id="time" aria-live="polite">—</div>
                </div>
            </div>
        </header>
        
        <main id="posts" role="main" aria-label="Posts feed">
            <div class="loading">
                <div class="skeleton"></div>
                <div class="skeleton" style="height: 80px;"></div>
                <p>Loading posts...</p>
            </div>
        </main>
    </div>

    <script>
        const postsContainer = document.getElementById('posts');
        const countEl = document.getElementById('count');
        const timeEl = document.getElementById('time');
        
        async function loadPosts() {
            try {
                const response = await fetch('http://localhost:8080/');
                
                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }
                
                const data = await response.json();
                
                countEl.textContent = data.record_count;
                timeEl.textContent = `${data.fetch_time_seconds}s`;
                
                const postsHTML = data.posts.map(post => `
                    <article class="card" tabindex="0">
                        <h3>${escapeHTML(post.title)}</h3>
                        <p>${escapeHTML(post.body)}</p>
                        <div class="card-meta">
                            <span>Post #${post.id}</span>
                            <span>User #${post.userId}</span>
                        </div>
                    </article>
                `).join('');
                
                postsContainer.innerHTML = postsHTML;
                postsContainer.setAttribute('role', 'main');
                
            } catch (error) {
                countEl.textContent = '—';
                timeEl.textContent = '—';
                postsContainer.innerHTML = `
                    <div class="error" role="alert">
                        Connection failed: ${escapeHTML(error.message)}
                        <br>Ensure pipeline.py is running on http://localhost:8080
                    </div>
                `;
            }
        }
        
        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        loadPosts();
    </script>
</body>
</html>
